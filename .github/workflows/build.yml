name: Build GDExtension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            platform: linux
          - name: Windows
            os: windows-latest
            platform: windows
          - name: macOS
            os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      - name: Build debug
        run: scons platform=${{ matrix.platform }} target=template_debug -j4

      - name: Build release
        run: scons platform=${{ matrix.platform }} target=template_release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: urbex-bin-${{ matrix.platform }}
          path: project/bin/

  package:
    name: Package project
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: urbex-bin-*
          path: project/bin
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: Urbex-Simulator-project
          path: project/
